<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图导入示例 - 高德 AMap</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
    .tip {
      position: fixed; top: 12px; left: 12px; z-index: 999;
      background: #fff; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15); font: 13px/1.6 system-ui;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="tip">
    打开本文件，找到下面脚本里 <b>MAP_CONFIG</b> 两行，把字符串换成你自己的
    Key 和安全密钥，保存后用浏览器打开即可看到地图。<br>
    高德会自动在角落显示审图号与版权署名，<b>不要删除</b>。
  </div>
  <div id="map"></div>

  <script>
    // ============================================================
    // ⚠️ 只改这一处：把下面两行的字符串换成你自己的值
    //   key           → 高德开放平台「Web端(JS API)」的 Key
    //   securityJsCode → 同一个 Key 对应的安全密钥
    // ============================================================
    const MAP_CONFIG = {
      key:           'b9aa3a3827a5c65ec163da004e02a4fd',
      securityJsCode:'299c56646c6b03a14d2ae9d33f2f7ac3'
    };

    // 高德 JS API 2.0 必须：先设置安全密钥，再加载 SDK
    window._AMapSecurityConfig = { securityJsCode: MAP_CONFIG.securityJsCode };

    // 动态注入高德 SDK（用上面的 key）
    const s = document.createElement('script');
    s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(MAP_CONFIG.key);
    s.onload = initMap;
    document.head.appendChild(s);

    function initMap() {
      const map = new AMap.Map('map', {
        zoom: 11,
        center: [116.397, 39.908], // [经度, 纬度]，GCJ-02 火星坐标（北京）
        viewMode: '3D'
      });

      const marker = new AMap.Marker({
        position: [116.397, 39.908],
        title: '北京'
      });
      map.add(marker);
    }
  </script>
</body>
</html>
